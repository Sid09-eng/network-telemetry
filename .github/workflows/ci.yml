name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test

  container-build:
    name: Compose syntax and image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build Compose service images
        run: docker compose build
      - name: Build the Containerlab traffic-host image
        run: make traffic-host-image

  terraform-validate:
    name: Terraform format and validation
    runs-on: ubuntu-24.04
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Initialise providers without a state backend
        run: terraform -chdir=infra/terraform init -backend=false
      - name: Check formatting
        run: terraform -chdir=infra/terraform fmt -check
      - name: Validate configuration without cloud credentials
        run: terraform -chdir=infra/terraform validate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
