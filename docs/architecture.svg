<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">NetPulse synthetic network telemetry architecture</title>
  <desc id="desc">A Containerlab FRR diamond carries traffic between two hosts. Read-only router exporters send metrics to Prometheus and Grafana. A detector sends alerts through Alertmanager to a guarded, dry-run remediation service that records an audit trail.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; } .title { fill: #0f172a; font: 700 30px sans-serif; }
      .subtitle { fill: #475569; font: 16px sans-serif; } .group { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .router { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; } .host { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .service { fill: #fef3c7; stroke: #d97706; stroke-width: 2; } .guard { fill: #fce7f3; stroke: #db2777; stroke-width: 2; }
      .label { fill: #0f172a; font: 700 17px sans-serif; text-anchor: middle; } .small { fill: #334155; font: 13px sans-serif; text-anchor: middle; }
      .note { fill: #475569; font: 13px sans-serif; } .line { stroke: #64748b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .data { stroke: #0891b2; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowBlue); }
      .alert { stroke: #db2777; stroke-width: 3; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowPink); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#0891b2"/></marker>
    <marker id="arrowPink" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#db2777"/></marker>
  </defs>
  <rect class="bg" width="1280" height="760" rx="18"/>
  <text class="title" x="48" y="55">NetPulse architecture</text>
  <text class="subtitle" x="48" y="82">Synthetic network telemetry, detection, and guarded remediation</text>

  <rect class="group" x="42" y="115" width="700" height="420" rx="16"/>
  <text class="subtitle" x="68" y="147">Containerlab · FRRouting · OSPF ECMP diamond</text>
  <path class="line" d="M158 325 L190 325"/><path class="line" d="M295 305 L335 260"/>
  <path class="line" d="M295 345 L335 390"/><path class="line" d="M440 260 L500 305"/>
  <path class="line" d="M440 390 L500 345"/><path class="line" d="M605 325 L635 325"/>
  <rect class="host" x="70" y="285" width="88" height="80" rx="10"/><text class="label" x="114" y="320">h1</text><text class="small" x="114" y="345">traffic source</text>
  <rect class="router" x="335" y="200" width="105" height="80" rx="10"/><text class="label" x="387" y="233">r2</text><text class="small" x="387" y="257">OSPF router</text>
  <rect class="router" x="335" y="370" width="105" height="80" rx="10"/><text class="label" x="387" y="403">r3</text><text class="small" x="387" y="427">OSPF router</text>
  <rect class="router" x="190" y="285" width="105" height="80" rx="10"/><text class="label" x="242" y="320">r1</text><text class="small" x="242" y="345">ECMP ingress</text>
  <rect class="router" x="500" y="285" width="105" height="80" rx="10"/><text class="label" x="552" y="320">r4</text><text class="small" x="552" y="345">OSPF router</text>
  <rect class="host" x="635" y="285" width="88" height="80" rx="10"/><text class="label" x="679" y="320">h2</text><text class="small" x="679" y="345">traffic sink</text>
  <text class="note" x="112" y="500">Controlled traffic and allow-listed fault scenarios stay synthetic.</text>

  <rect class="group" x="772" y="115" width="466" height="420" rx="16"/>
  <text class="subtitle" x="798" y="147">Local monitoring and control plane</text>
  <rect class="service" x="812" y="185" width="165" height="76" rx="10"/><text class="label" x="894" y="216">Prometheus</text><text class="small" x="894" y="240">scrape + rules</text>
  <rect class="service" x="1040" y="185" width="154" height="76" rx="10"/><text class="label" x="1117" y="216">Grafana</text><text class="small" x="1117" y="240">loopback UI</text>
  <rect class="service" x="812" y="326" width="165" height="76" rx="10"/><text class="label" x="894" y="357">Detector</text><text class="small" x="894" y="381">forecast + anomaly</text>
  <rect class="service" x="1040" y="326" width="154" height="76" rx="10"/><text class="label" x="1117" y="357">Alertmanager</text><text class="small" x="1117" y="381">route alerts</text>
  <rect class="guard" x="902" y="442" width="200" height="70" rx="10"/><text class="label" x="1002" y="472">Remediation API</text><text class="small" x="1002" y="495">dry-run, allow-list, audit</text>
  <path class="data" d="M605 300 C700 230 740 220 812 220"/><text class="note" x="670" y="208">read-only exporters</text>
  <path class="data" d="M977 223 L1040 223"/><path class="data" d="M894 261 L894 326"/>
  <path class="alert" d="M977 364 L1040 364"/><path class="alert" d="M1117 402 L1040 442"/>
  <path class="alert" d="M902 477 C775 480 690 460 605 360"/><text class="note" x="650" y="512">explicit live override required</text>
  <rect x="42" y="580" width="1196" height="125" rx="12" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <text class="label" x="150" y="628">Security boundary</text>
  <text class="note" x="245" y="615">Exporters read only interface counters · dashboards bind to loopback · cloud VM receives no service account</text>
  <text class="note" x="245" y="646">Live OSPF changes need two explicit flags plus a Docker-socket compose override · every decision is audit logged</text>
  <text class="note" x="245" y="677">Gitleaks and protected CI guard the public source; credentials, state, captures, and audit logs remain ignored</text>
</svg>
