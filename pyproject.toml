[build-system]
requires = ["hatchling>=1.33.0,<2"]
build-backend = "hatchling.build"

[project]
name = "netpulse"
version = "0.1.0"
description = "Simulated network telemetry, forecasting, anomaly detection, and guarded auto-remediation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "NetPulse contributors" }]
dependencies = [
  "fastapi>=0.165.0,<1",
  "PyYAML>=6.0.3,<7",
  "scikit-learn>=1.6,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "Pillow>=10,<14",
  "pytest>=9.2.0,<10",
  "ruff>=0.17.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["forecast", "monitoring", "remediation", "traffic"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
