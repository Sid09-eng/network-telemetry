global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - recording_rules.yml
  - alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: netpulse-router-interfaces
    static_configs:
      - targets:
          - 172.20.20.11:9100
          - 172.20.20.12:9100
          - 172.20.20.13:9100
          - 172.20.20.14:9100
  - job_name: netpulse-detector
    static_configs:
      - targets:
          - detector:8001
  - job_name: netpulse-remediation
    static_configs:
      - targets:
          - remediation:8000
