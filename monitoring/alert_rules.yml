groups:
  - name: netpulse-anomalies
    interval: 5s
    rules:
      - alert: NetPulseLinkAnomaly
        # A utilisation increase remains visible in Grafana but does not authorize a reroute.
        # Only an unexpected utilisation drop can request guarded remediation.
        expr: netpulse_anomaly_active > 0 and netpulse_anomaly_residual < 0
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: NetPulse residual anomaly on {{ $labels.link }}
          description: Residual score is {{ $value }} above the configured validation threshold.
